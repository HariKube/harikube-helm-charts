apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: topology-config
spec:
  skipDelete: true
  namespace: harikube
  timeouts:
    apply: 30s
    assert: 1m
  steps:
  - name: Create database
    try:
    - apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mysql-deployment
            namespace: harikube
            labels:
              app: mariadb
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mariadb
            template:
              metadata:
                labels:
                  app: mariadb
              spec:
                containers:
                - name: mariadb
                  image: ghcr.io/linuxserver/mariadb:10.11.8
                  ports:
                  - containerPort: 3306
                  env:
                  - name: MYSQL_ROOT_PASSWORD
                    value: "passwd"
                  - name: TZ
                    value: "Europe/Budapest"
    - apply:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mysql-internal-service
            namespace: harikube
          spec:
            type: ClusterIP 
            selector:
              app: mariadb
            ports:
              - protocol: TCP
                port: 3306
                targetPort: 3306
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mysql-deployment
            namespace: harikube
          status:
            readyReplicas: 1
    - sleep:
        duration: 30s
  - name: Create topology config
    try:
    - apply:
        resource:
          apiVersion: harikube.info/v1
          kind: TopologyConfig
          metadata:
            annotations:
              harikube.info/deployOrder: "1"
            name: topologyconfig-shirts
            namespace: harikube
          spec:
            targetSecret: harikube/topology-config
            backends:
            - name: shirts
              endpoint: mysql://root:passwd@tcp(mysql-internal-service.harikube.svc.cluster.local:3306)/kine_db
              connectionPool:
                maxIdle: 5
                maxOpen: 90
                maxLifeTime: 5m
                maxIdleLifeTime: 5m
              customresource:
                group: stable.example.com
                kind: shirts
    - apply:
        resource:
          apiVersion: harikube.info/v1
          kind: TopologyConfig
          metadata:
            annotations:
              harikube.info/deployOrder: "2"
            name: topologyconfig-namespace
            namespace: harikube
          spec:
            targetSecret: harikube/topology-config
            backends:
            - name: namespace
              endpoint: sqlite://./db/namespace.db?_journal=WAL&cache=shared
              namespace:
                namespace: test
    - assert:
        resource:
          apiVersion: harikube.info/v1
          kind: TopologyConfig
          metadata:
            name: topologyconfig-shirts
            namespace: harikube
          status:
            deployOrder: 1
            deployStatus: Active
    - assert:
        resource:
          apiVersion: harikube.info/v1
          kind: TopologyConfig
          metadata:
            name: topologyconfig-namespace
            namespace: harikube
          status:
            deployOrder: 2
            deployStatus: Active
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: topology-config
            namespace: harikube
            finalizers:
            - harikube.info/finalizer
          data:
            (base64_decode("1-topologyconfig-shirts.yaml")): |
              backends:
              - name: shirts
                endpoint: mysql://root:passwd@tcp(mysql-internal-service.harikube.svc.cluster.local:3306)/kine_db
                connectionPool:
                  maxIdle: 5
                  maxOpen: 90
                  maxLifeTime: 5m0s
                  maxIdleLifeTime: 5m0s
                customresource:
                  group: stable.example.com
                  kind: shirts
            (base64_decode("2-topologyconfig-namespace.yaml")): |
              backends:
              - name: namespace
                endpoint: sqlite://./db/namespace.db?_journal=WAL&cache=shared
                namespace:
                  namespace: test
                  kinds: []
  - name: Validate database registration
    try:
    - sleep:
        duration: 5s
    - script:
        content: |
          kubectl logs -n harikube -l app.kubernetes.io/component=harikube-middleware --since=0 | grep -q 'Backends registered: \[shirts namespace main\]'