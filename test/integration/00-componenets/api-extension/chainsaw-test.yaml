apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tests
spec:
  namespace: chainsaw-pod-test
  timeouts:
    assert: 1m
  steps:
  - name: Pod test
    try:
    - script:
        content: kubectl create configmap -n chainsaw-pod-test all-namespace --from-literal="count=$(kubectl get counts -A --field-selector=apiVersion=/v1,kind=Pod -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "13"
          kind: ConfigMap
          metadata:
            name: all-namespace
    - script:
        content: kubectl create configmap -n chainsaw-pod-test harikube-namespace --from-literal="count=$(kubectl get counts -n kube-system --field-selector=apiVersion=/v1,kind=Pod -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "8"
          kind: ConfigMap
          metadata:
            name: harikube-namespace
    - script:
        content: kubectl create configmap -n chainsaw-pod-test label-selector --from-literal="count=$(kubectl get counts -A -l control-plane=controller-manager --field-selector=apiVersion=/v1,kind=Pod -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: label-selector
    - script:
        content: kubectl create configmap -n chainsaw-pod-test field-selector --from-literal="count=$(kubectl get counts -A --field-selector=apiVersion=/v1,kind=Pod,metadata.namespace=kube-system -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "8"
          kind: ConfigMap
          metadata:
            name: field-selector
    - script:
        content: kubectl create serviceaccount sa-count-test -n chainsaw-pod-test && kubectl create configmap -n chainsaw-pod-test sa-count --from-literal="count=$(kubectl get counts -n kube-system --field-selector=apiVersion=/v1,kind=ServiceAccount,metadata.name=kube-proxy -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: sa-count
    - script:
        content: kubectl create secret generic secret-count-test -n chainsaw-pod-test --from-literal=key=value && kubectl create configmap -n chainsaw-pod-test secret-count --from-literal="count=$(kubectl get counts -n harikube --field-selector=apiVersion=/v1,kind=Secret,metadata.name=api-extension-harikube-connection -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: secret-count
    - script:
        content: kubectl create role role-count-test --verb=get --resource=pods -n chainsaw-pod-test && kubectl create configmap -n chainsaw-pod-test role-count --from-literal="count=$(kubectl get counts -n harikube --field-selector=apiVersion=rbac.authorization.k8s.io/v1,kind=Role,metadata.name=api-extension-leader-election-role -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: role-count
    - script:
        content: kubectl create clusterrole clusterrole-count-test --verb=get --resource=nodes && kubectl create configmap -n chainsaw-pod-test clusterrole-count --from-literal="count=$(kubectl get counts --field-selector=apiVersion=rbac.authorization.k8s.io/v1,kind=ClusterRole,metadata.name=system:coredns -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: clusterrole-count
    - script:
        content: |-
          kubectl apply -f - <<'YAML'
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: issuer-count-test
            namespace: chainsaw-pod-test
          spec:
            selfSigned: {}
          YAML
          kubectl create configmap -n chainsaw-pod-test issuer-count --from-literal="count=$(kubectl get counts -n chainsaw-pod-test --field-selector=apiVersion=cert-manager.io/v1,kind=Issuer,metadata.name=issuer-count-test -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: issuer-count
    - script:
        content: |-
          kubectl apply -f - <<'YAML'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: clusterissuer-count-test
          spec:
            selfSigned: {}
          YAML
          kubectl create configmap -n chainsaw-pod-test clusterissuer-count --from-literal="count=$(kubectl get counts -A --field-selector=apiVersion=cert-manager.io/v1,kind=ClusterIssuer,metadata.name=clusterissuer-count-test -o jsonpath='{.items[0].spec.count}')"
    - assert:
        resource:
          apiVersion: v1
          data:
            count: "1"
          kind: ConfigMap
          metadata:
            name: clusterissuer-count
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: decision
spec:
  namespace: chainsaw-decision-test
  timeouts:
    assert: 1m
    exec: 5m
  steps:
  - name: Submit a decision request
    try:
    - script:
        content: |
          kubectl get deployment api-extension-controller-manager -n harikube -o jsonpath='{.spec.template.spec.containers[*].name}' | grep -Eq '(^| )decision-maker( |$)'
    - script:
        content: |
          response=$(cat <<'EOF' | kubectl create --raw "/apis/apiserver.api-extension.harikube.info/v1/namespaces/chainsaw-decision-test/decisionrequests" -f -
          apiVersion: apiserver.api-extension.harikube.info/v1
          kind: DecisionRequest
          metadata:
            name: refund-triage
            namespace: chainsaw-decision-test
          spec:
            state:
              subject: Refund not received
              body: I cancelled two weeks ago and still have no refund. This is critical because the invoice is due and I may dispute the payment.
            questions:
              department:
                type: choice
                instructions: Which team should handle this ticket?
                criteria:
                  billing: payments refunds invoices disputes
                  support: product help and bugs
                  sales: new purchases
              urgency:
                type: score
                instructions: How urgent is this ticket?
                criteria:
                - not urgent
                - somewhat urgent
                - urgent
                - critical
              churn_risk:
                type: noul
                instructions: Is the customer likely to cancel or dispute?
          EOF
          )

          RESPONSE="$response" python - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          assert response["kind"] == "DecisionResponse", response
          assert response["metadata"]["name"] == "refund-triage", response
          assert response["metadata"]["namespace"] == "chainsaw-decision-test", response

          answers = response["spec"]["answers"]
          usage = response["spec"].get("usage", {})
          provider = usage.get("provider")
          if provider is not None:
              assert provider in {"mock", "laya"}, response

          department = answers["department"]
          assert department["choice"] in {"billing", "support", "sales"}, answers
          assert set(department["probabilities"]) == {"billing", "support", "sales"}, answers

          if provider == "mock":
              assert department["choice"] == "billing", answers

          urgency = answers["urgency"]
          assert isinstance(urgency["score"], (int, float)), answers
          assert 0 <= urgency["score"] <= 3, answers
          if "distribution" in urgency:
              assert len(urgency["distribution"]) == 4, answers
          else:
              assert len(urgency["probabilities"]) == 4, answers

          churn_risk = answers["churn_risk"]
          assert isinstance(churn_risk["noul"], (int, float)), answers
          assert 0 <= churn_risk["noul"] <= 1, answers
          assert churn_risk["noul"] >= 0.5, answers
          PY
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: transaction
spec:
  namespace: chainsaw-transaction-test
  timeouts:
    assert: 1m
    exec: 1m
  steps:
  - name: Grant namespaced validation permissions
    try:
    - script:
        content: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: transaction-validation
            namespace: chainsaw-transaction-test
          rules:
          - apiGroups:
            - apps
            resources:
            - deployments
            verbs:
            - create
            - update
          - apiGroups:
            - cert-manager.io
            resources:
            - certificates
            verbs:
            - create
            - update
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: transaction-validation
            namespace: chainsaw-transaction-test
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: transaction-validation
          subjects:
          - kind: ServiceAccount
            name: api-extension-controller-manager
            namespace: harikube
          EOF

          for _ in $(seq 1 30); do
            if kubectl auth can-i \
              --as=system:serviceaccount:harikube:api-extension-controller-manager \
              create deployments.apps \
              -n chainsaw-transaction-test >/dev/null 2>&1 && \
              kubectl auth can-i \
              --as=system:serviceaccount:harikube:api-extension-controller-manager \
              create certificates.cert-manager.io \
              -n chainsaw-transaction-test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          echo "timed out waiting for transaction validation RBAC to propagate" >&2
          exit 1
  - name: Accept a transaction for a server-defaulted Deployment
    try:
    - script:
        content: |
          set +e
          response=$(cat <<'EOF' | kubectl create --dry-run=server -o json -f - 2>&1
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: wallet-processor
            namespace: chainsaw-transaction-test
          spec:
            selector:
              matchLabels:
                app: wallet-processor
            template:
              metadata:
                labels:
                  app: wallet-processor
              spec:
                containers:
                - name: worker
                  image: nginx:1.27.5
          EOF
          )
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$response"
            exit "$status"
          fi

          RESPONSE="$response" python - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          assert response["kind"] == "Deployment", response
          assert response["metadata"]["name"] == "wallet-processor", response
          assert response["spec"]["strategy"]["type"] == "RollingUpdate", response
          assert response["spec"]["revisionHistoryLimit"] == 10, response
          template = response["spec"]["template"]
          assert template["spec"]["dnsPolicy"] == "ClusterFirst", response
          assert template["spec"]["restartPolicy"] == "Always", response
          PY
    - script:
        content: |
          txn_name="create-defaulted-deployment-$(date +%s%N)"
          set +e
          response=$(cat <<EOF | kubectl create --raw "/apis/apiserver.api-extension.harikube.info/v1/namespaces/chainsaw-transaction-test/transactionrequests" -f - 2>&1
          apiVersion: apiserver.api-extension.harikube.info/v1
          kind: TransactionRequest
          metadata:
            name: ${txn_name}
            namespace: chainsaw-transaction-test
          spec:
            create:
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wallet-processor
                namespace: chainsaw-transaction-test
              spec:
                selector:
                  matchLabels:
                    app: wallet-processor
                template:
                  metadata:
                    labels:
                      app: wallet-processor
                  spec:
                    containers:
                    - name: worker
                      image: nginx:1.27.5
          EOF
          )
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$response"
            exit "$status"
          fi

          TXN_NAME="$txn_name" RESPONSE="$response" python - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          assert response["kind"] == "TransactionResponse", response
          assert response["metadata"]["name"] == os.environ["TXN_NAME"], response
          assert response["metadata"]["namespace"] == "chainsaw-transaction-test", response
          assert response["metadata"]["resourceVersion"], response
          PY
  - name: Reject a transaction for an invalid Deployment
    try:
    - script:
        content: |
          set +e
          output=$(cat <<'EOF' | kubectl create --raw "/apis/apiserver.api-extension.harikube.info/v1/namespaces/chainsaw-transaction-test/transactionrequests" -f - -v=8 2>&1
          apiVersion: apiserver.api-extension.harikube.info/v1
          kind: TransactionRequest
          metadata:
            name: reject-invalid-deployment
            namespace: chainsaw-transaction-test
          spec:
            create:
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: invalid-wallet-processor
                namespace: chainsaw-transaction-test
              spec:
                selector:
                  matchLabels:
                    app: wallet-processor
                template:
                  metadata:
                    labels:
                      app: someone-else
                  spec:
                    containers:
                    - name: worker
                      image: nginx:1.27.5
          EOF
          )
          status=$?
          set -e

          test "$status" -ne 0
          printf '%s' "$output" | grep -Eqi 'selector.*template.*labels|template.*labels.*selector|Invalid value'
  - name: Accept a transaction for a webhook-validated Certificate
    try:
    - script:
        content: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: wallet-selfsigned
            namespace: chainsaw-transaction-test
          spec:
            selfSigned: {}
          EOF
    - script:
        content: |
          set +e
          response=$(cat <<'EOF' | kubectl create --dry-run=server -o json -f - 2>&1
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: wallet-tls
            namespace: chainsaw-transaction-test
          spec:
            secretName: wallet-tls
            dnsNames:
            - wallet.example.com
            issuerRef:
              name: wallet-selfsigned
          EOF
          )
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$response"
            exit "$status"
          fi

          RESPONSE="$response" python - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          assert response["kind"] == "Certificate", response
          assert response["metadata"]["name"] == "wallet-tls", response
          issuer_ref = response["spec"]["issuerRef"]
          assert issuer_ref["name"] == "wallet-selfsigned", response
          PY
    - script:
        content: |
          txn_name="create-defaulted-certificate-$(date +%s%N)"
          set +e
          response=$(cat <<EOF | kubectl create --raw "/apis/apiserver.api-extension.harikube.info/v1/namespaces/chainsaw-transaction-test/transactionrequests" -f - 2>&1
          apiVersion: apiserver.api-extension.harikube.info/v1
          kind: TransactionRequest
          metadata:
            name: ${txn_name}
            namespace: chainsaw-transaction-test
          spec:
            create:
            - apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: wallet-tls
                namespace: chainsaw-transaction-test
              spec:
                secretName: wallet-tls
                dnsNames:
                - wallet.example.com
                issuerRef:
                  name: wallet-selfsigned
          EOF
          )
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$response"
            exit "$status"
          fi

          TXN_NAME="$txn_name" RESPONSE="$response" python - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          assert response["kind"] == "TransactionResponse", response
          assert response["metadata"]["name"] == os.environ["TXN_NAME"], response
          assert response["metadata"]["namespace"] == "chainsaw-transaction-test", response
          assert response["metadata"]["resourceVersion"], response
          PY
  - name: Reject a transaction for an invalid Certificate
    try:
    - script:
        content: |
          set +e
          output=$(cat <<'EOF' | kubectl create --raw "/apis/apiserver.api-extension.harikube.info/v1/namespaces/chainsaw-transaction-test/transactionrequests" -f - -v=8 2>&1
          apiVersion: apiserver.api-extension.harikube.info/v1
          kind: TransactionRequest
          metadata:
            name: reject-invalid-certificate
            namespace: chainsaw-transaction-test
          spec:
            create:
            - apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: invalid-wallet-tls
                namespace: chainsaw-transaction-test
              spec:
                secretName: invalid-wallet-tls
                dnsNames:
                - invalid-wallet.example.com
                duration: 24h
                renewBefore: 48h
                issuerRef:
                  name: wallet-selfsigned
          EOF
          )
          status=$?
          set -e

          test "$status" -ne 0
          printf '%s' "$output" | grep -Eqi 'renewBefore.*duration|duration.*renewBefore|must be less than'
