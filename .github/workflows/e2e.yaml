name: E2E Test

on:
  push:
    branches-ignore:
    - release-v**
    - rc-v**
    - beta-v**
    - alpha-v**
    - dev-v**

  pull_request:
    branches: [main]

concurrency: 
  group: ${{ github.ref_name }}-e2e
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, '+E2E') }}
    strategy:
      matrix:
        certManager: [ false, true ]
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: 'true'

      - name: Create license and credential
        run: |
          mkdir -p .vscode
          echo -n "${{ secrets.HARIKUBE_LICENSE }}" > .vscode/license
          echo -n "${{ secrets.HARIKUBE_CREDENTIAL }}" > .vscode/credential

      - name: Run tester
        run: devbox run make test-e2e
        env:
          CERT_MANAGER: ${{ matrix.certManager }}