{{- if .Values.serverlessKubeWatchTrigger.create -}}
# ServiceAccounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serverless-kube-watch-trigger-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: serverless-kube-watch-trigger
    control-plane: controller-manager
---
# Namespaced Roles
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: serverless-kube-watch-trigger-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: serverless-kube-watch-trigger
    control-plane: controller-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
# ClusterRoles (available cluster-wide, not all are bound here)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: serverless-kube-watch-trigger-manager-role
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: serverless-kube-watch-trigger
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events", "secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["triggers.harikube.info"]
    resources: ["httptriggers", "pitriggers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["triggers.harikube.info"]
    resources: ["httptriggers/finalizers", "pitriggers/finalizers"]
    verbs: ["update"]
  - apiGroups: ["triggers.harikube.info"]
    resources: ["httptriggers/status", "pitriggers/status"]
    verbs: ["get", "patch", "update"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
# RoleBindings (namespaced)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: serverless-kube-watch-trigger-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: serverless-kube-watch-trigger
subjects:
  - kind: ServiceAccount
    name: serverless-kube-watch-trigger-controller-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: serverless-kube-watch-trigger-leader-election-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRoleBindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serverless-kube-watch-trigger-manager-rolebinding
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: serverless-kube-watch-trigger
subjects:
  - kind: ServiceAccount
    name: serverless-kube-watch-trigger-controller-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: serverless-kube-watch-trigger-manager-role
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
