{{- if .Values.serverlessKubeWatchTrigger.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: serverless-kube-watch-trigger
    control-plane: controller-manager
  name: {{ include "harikube.serverlessKubeWatchTrigger.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serverlessKubeWatchTrigger.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
