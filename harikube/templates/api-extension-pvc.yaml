{{- if .Values.apiExtension.create -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: api-extension
    control-plane: controller-manager
  name: api-extension-decision-maker-cache
  namespace: {{ .Release.Namespace }}
spec:
  {{- toYaml .Values.apiExtension.pvc | nindent 2 }}
{{- end }}
