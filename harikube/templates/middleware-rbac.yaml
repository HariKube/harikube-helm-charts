{{- if .Values.middleware.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: lease-manager
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: lease-manager
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: lease-manager
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: lease-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lease-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: lease-manager-cluster
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: lease-manager-cluster
subjects:
  - kind: ServiceAccount
    name: lease-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lease-manager-cluster
{{- end }}
