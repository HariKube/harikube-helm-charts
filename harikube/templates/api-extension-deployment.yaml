{{- if .Values.apiExtension.create -}}
{{- $registry := .Values.apiExtension.image.registry -}}
{{- $repository := default "harikube/api-extension" .Values.apiExtension.image.repository -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
    app.kubernetes.io/name: api-extension
    control-plane: controller-manager
  name: api-extension-controller-manager
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.apiExtension.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-extension
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.apiExtension.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "harikube.labels" . | nindent 8 }}
        app.kubernetes.io/name: api-extension
        control-plane: controller-manager
        {{- with .Values.apiExtension.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 10
      serviceAccountName: api-extension-controller-manager
      {{- with .Values.apiExtension.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiExtension.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiExtension.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.apiExtension.podSecurityContext | nindent 8 }}
      containers:
      - args:
          {{- toYaml .Values.apiExtension.args | nindent 10 }}
        command:
        - /manager
        env:
        - name: CORE_RESOURCES
          valueFrom:
            configMapKeyRef:
              key: resources
              name: api-extension-core-resources
        image: "{{- if $registry -}}{{ $registry }}/{{- end -}}{{ $repository }}:{{ .Values.apiExtension.image.tag }}"
        imagePullPolicy: {{ .Values.apiExtension.image.pullPolicy }}
        livenessProbe:
          {{- toYaml .Values.apiExtension.livenessProbe | nindent 10 }}
        name: manager
        ports:
        - containerPort: {{ .Values.apiExtension.service.api.targetPort }}
          name: apiserver
          protocol: TCP
        readinessProbe:
          {{- toYaml .Values.apiExtension.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.apiExtension.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.apiExtension.securityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /tmp/k8s-apiserver-server/serving-certs
          name: apiserver-certs
          readOnly: true
        - mountPath: /tmp/harikube-connection
          name: harikube-connection
          readOnly: true
        - mountPath: /tmp/harikube-middleware-crt
          name: harikube-middleware-crt
          readOnly: true
      volumes:
      - name: apiserver-certs
        secret:
          secretName: v1-api-extension-crt
      - name: harikube-connection
        secret:
          secretName: api-extension-harikube-connection
      - name: harikube-middleware-crt
        secret:
          secretName: harikube-middleware-crt
{{- end }}
