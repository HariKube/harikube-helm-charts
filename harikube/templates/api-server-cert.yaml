{{- if .Values.apiServer.create -}}
{{- if .Values.certManagerIntegration.create -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: harikube-api-server-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    {{- include "harikube.labels" . | nindent 4 }}
  name: harikube-api-server-crt
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
  - kubernetes.default.svc.cluster.local, kubernetes.default.svc
  - kubernetes.default
  - kubernetes
  - localhost
  - "*.harikube.{{ .Release.Namespace }}.nodes.vcluster.com"
  - "*.nodes.vcluster.com"
  - harikube
  - harikube.{{ .Release.Namespace }}
  - harikube-api-server-svc.{{ .Release.Namespace }}
  - harikube-api-server-svc.{{ .Release.Namespace }}.svc
  - harikube-api-server-svc.{{ .Release.Namespace }}.cluster.local
  - harikube-api-server-svc.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: harikube-api-server-issuer
  secretName: harikube-api-server-crt
{{- else -}}
{{- $tls := include "harikube.getOrGenTls" (dict "root" . "secretName" "harikube-api-server-crt" "cn" "harikube-api-server-svc") | fromYaml -}}
apiVersion: v1
kind: Secret
metadata:
  name: harikube-api-server-crt
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $tls.caCert }}
  tls.crt: {{ $tls.tlsCert }}
  tls.key: {{ $tls.tlsKey }}
{{- end }}
{{- end }}
