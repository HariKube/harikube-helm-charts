suite: ServerlessKubeWatchTrigger Host ServiceAccount

# Unit test: ensure host-side serverless-kube-watch-trigger ServiceAccount is included in RBAC template
# when serverlessKubeWatchTrigger.create is true.

templates:
  - serverless-kube-watch-trigger-rbac.yaml

tests:
  - it: should render a host ServiceAccount when serverlessKubeWatchTrigger.create is true
    templates:
      - serverless-kube-watch-trigger-rbac.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 5
      - documentIndex: 0
        isKind:
          of: ServiceAccount

  - it: should not render ServiceAccount when serverlessKubeWatchTrigger.create is false
    templates:
      - serverless-kube-watch-trigger-rbac.yaml
    set:
      serverlessKubeWatchTrigger:
        create: false
    asserts:
      - hasDocuments:
          count: 0
