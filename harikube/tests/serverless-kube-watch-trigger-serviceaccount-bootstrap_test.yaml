suite: ServerlessKubeWatchTrigger Host ServiceAccount

# Unit test: ensure host-side serverless-kube-watch-trigger ServiceAccount template renders a ServiceAccount
# when serverlessKubeWatchTrigger.create is true.

templates:
  - serverless-kube-watch-trigger-serviceaccount.yaml

tests:
  - it: should render a host ServiceAccount when serverlessKubeWatchTrigger.create is true
    templates:
      - serverless-kube-watch-trigger-serviceaccount.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: serverless-kube-watch-trigger-controller-manager
      - equal:
          path: metadata.namespace
          value: my-namespace
