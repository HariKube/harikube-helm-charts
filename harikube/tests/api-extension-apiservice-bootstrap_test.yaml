suite: api-extension APIService Suppression when apiExtension.create Enabled

# Unit test: ensure host-side api-extension APIService template renders nothing when apiExtension.create is true
# (no separate vcluster.bootstrapJob.enabled flag is required)

templates:
  - api-extension-apiservice.yaml

tests:
  - it: should not render api-extension APIService when apiExtension.create is enabled
    templates:
      - api-extension-apiservice.yaml
    set:
      apiExtension:
        create: true
    asserts:
      - hasDocuments:
          count: 0
