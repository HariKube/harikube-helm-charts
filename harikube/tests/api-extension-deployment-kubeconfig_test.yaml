suite: api-extension Deployment Kubeconfig

# Unit test: ensure the api-extension Deployment mounts a dedicated vCluster kubeconfig Secret
# and prefers KUBECONFIG for auth (TDD-style; production change will update the template to satisfy this test)

templates:
  - api-extension-deployment.yaml

tests:
  - it: should render Deployment mounting a vCluster kubeconfig secret and prefer KUBECONFIG
    templates:
      - api-extension-deployment.yaml
    set:
      apiExtension:
        create: true
        volumes:
          - name: kubeconfig
            secret:
              secretName: vc-api-extension
              items:
                - key: config
                  path: config
        volumeMounts:
          - name: kubeconfig
            mountPath: /etc/kubernetes/kubeconfig
            readOnly: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig
            secret:
              secretName: vc-api-extension
              items:
                - key: config
                  path: config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kubeconfig
            mountPath: /etc/kubernetes/kubeconfig
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBECONFIG
            value: /etc/kubernetes/kubeconfig/config
          count: 1
