suite: api-extension Deployment Kubeconfig

# Unit test: ensure the api-extension Deployment is working correctly
# Note: KUBECONFIG-specific features are aspirational and not yet implemented in the template.

templates:
  - api-extension-deployment.yaml

tests:
  - it: should render Deployment when api-extension is created
    templates:
      - api-extension-deployment.yaml
    set:
      apiExtension:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: api-extension-controller-manager
      - hasDocuments:
          count: 1
