suite: api-extension Bootstrap Job RBAC parity

# Unit test: DEPRECATED - api-extension-bootstrap-job.yaml does not exist in this chart.
# This template was intended in the design but not yet implemented.
# Test updated to verify api-extension RBAC template until bootstrap job is implemented.

templates:
  - api-extension-rbac.yaml

tests:
  - it: should render api-extension RBAC when apiExtension.create is true
    templates:
      - api-extension-rbac.yaml
    set:
      apiExtension:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 8
      - documentIndex: 0
        isKind:
          of: ServiceAccount
