suite: ServerlessKubeWatchTriggerLeaderElection

# Render the Deployment template and (optionally) a future MutatingAdmissionPolicy template
templates:
  - serverless-kube-watch-trigger-deployment.yaml
  - serverless-kube-watch-trigger-scaling-configmap-labeler.yaml

tests:
  - it: should render Deployment and not render MutatingAdmissionPolicy when leaderElection enabled (true)
    set:
      serverlessKubeWatchTrigger:
        create: true
        leaderElection:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serverless-kube-watch-trigger-controller-manager
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--leader-elect"
          count: 1

  - it: should render Deployment with leader-election disabled when leaderElection enabled is false
    set:
      serverlessKubeWatchTrigger:
        create: true
        leaderElection:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--leader-elect=false"
          count: 1

  - it: should not render scaling MutatingAdmissionPolicy when leaderElection enabled (true)
    templates:
      - serverless-kube-watch-trigger-scaling-configmap-labeler.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        leaderElection:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render scaling MutatingAdmissionPolicy when leaderElection enabled is false
    templates:
      - serverless-kube-watch-trigger-scaling-configmap-labeler.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        leaderElection:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: MutatingAdmissionPolicy
      - equal:
          path: metadata.name
          value: scaling-configmap-labeler
