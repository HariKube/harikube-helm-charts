suite: ServerlessKubeWatchTriggerLeaderElection

# Render the Deployment template and (optionally) a future MutatingAdmissionPolicy template
templates:
  - serverless-kube-watch-trigger-deployment.yaml
  - serverless-kube-watch-trigger-scaling-configmap-labeler.yaml

tests:
  - it: should render Deployment and not render MutatingAdmissionPolicy when leaderElection enabled (true)
    templates:
      - serverless-kube-watch-trigger-deployment.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
        leaderElection:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serverless-kube-watch-trigger-controller-manager
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--enable-leader-election"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          count: 1

  - it: should render Deployment with leader-election disabled when leaderElection enabled is false
    templates:
      - serverless-kube-watch-trigger-deployment.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
        leaderElection:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--enable-leader-election=false"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          count: 1

  - it: should not render scaling MutatingAdmissionPolicy when leaderElection enabled (true)
    templates:
      - serverless-kube-watch-trigger-scaling-configmap-labeler.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
        leaderElection:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render scaling MutatingAdmissionPolicy when leaderElection enabled is false
    templates:
      - serverless-kube-watch-trigger-scaling-configmap-labeler.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
        leaderElection:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: kind
          value: MutatingAdmissionPolicy
      - documentIndex: 0
        equal:
          path: metadata.name
          value: trigger-distribution-labeler
      - documentIndex: 0
        equal:
          path: spec.mutations[0].patchType
          value: ApplyConfiguration
      - documentIndex: 0
        matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: "Object\\{metadata: Object\\.metadata\\{labels:"
      - documentIndex: 1
        equal:
          path: kind
          value: MutatingAdmissionPolicyBinding
      - documentIndex: 1
        equal:
          path: metadata.name
          value: trigger-distribution-labeler
      - documentIndex: 1
        equal:
          path: spec.policyName
          value: trigger-distribution-labeler
