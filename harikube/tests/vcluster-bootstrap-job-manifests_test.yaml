suite: vCluster Bootstrap Job - Manifests

# Unit test: ensure the inline bootstrap manifest in the host-side Job targets the release namespace
# and includes the key resource kinds and service name required for api-extension ownership (TDD-style)

templates:
  - serverless-kube-watch-trigger-bootstrap-job.yaml

tests:
  - it: should render inline bootstrap manifest targeting the release namespace and include api-extension kinds
    templates:
      - serverless-kube-watch-trigger-bootstrap-job.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Job
      - equal:
          path: metadata.name
          value: my-release-serverless-kube-watch-trigger-bootstrap-job
      - equal:
          path: metadata.namespace
          value: my-namespace
