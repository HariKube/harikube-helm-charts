suite: vCluster Bootstrap Job

# Planned host-side bootstrap Job for vCluster; TDD-style unit tests assert rendering when enabled
templates:
  - api-extension-bootstrap-job.yaml

tests:
  - it: should render a Job mounting the existing vc-harikube secret when enabled
    templates:
      - api-extension-bootstrap-job.yaml
    set:
      apiExtension:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Job
      - equal:
          path: metadata.name
          value: my-release-api-extension-bootstrap-job
      - equal:
          path: metadata.namespace
          value: my-namespace
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig
            secret:
              secretName: vc-harikube
              items:
                - key: config
                  path: config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kubeconfig
            mountPath: /kubeconfig
            readOnly: true
