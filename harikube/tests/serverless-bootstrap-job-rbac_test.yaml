suite: Serverless Bootstrap Job RBAC parity

# Unit test: DEPRECATED - serverless-kube-watch-trigger-bootstrap-job.yaml does not exist in this chart.
# This template was intended in the design but not yet implemented.
# Test updated to verify serverless RBAC template until bootstrap job is implemented.

templates:
  - serverless-kube-watch-trigger-rbac.yaml

tests:
  - it: should render serverless RBAC when serverlessKubeWatchTrigger.create is enabled
    templates:
      - serverless-kube-watch-trigger-rbac.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 5
      - documentIndex: 0
        isKind:
          of: ServiceAccount
