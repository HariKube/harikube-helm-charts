suite: Serverless Bootstrap Job RBAC parity

# Unit test: ensure the rendered serverless-kube-watch-trigger bootstrap Job includes RBAC parity markers
# (TDD-style: this test asserts the inline bootstrap script contains the expected legacy RBAC objects/rules and bindings)

templates:
  - serverless-kube-watch-trigger-bootstrap-job.yaml

tests:
  - it: should render a Job with serverless bootstrap RBAC parity markers in the inline script when enabled
    templates:
      - serverless-kube-watch-trigger-bootstrap-job.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Job
      - equal:
          path: metadata.name
          value: my-release-serverless-kube-watch-trigger-bootstrap-job
      - equal:
          path: metadata.namespace
          value: my-namespace
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-leader-election-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-leader-election-rolebinding"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-pi-agent-worker"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-manager-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-manager-rolebinding"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-pi-agent-worker-discovery"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-pi-agent-worker-discovery-rolebinding"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-httptrigger-admin-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-httptrigger-editor-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-httptrigger-viewer-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-pitrigger-admin-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-pitrigger-editor-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "serverless-kube-watch-trigger-pitrigger-viewer-role"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "pods/exec"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "apiservices"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "customresourcedefinitions"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "httptriggers"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "pitriggers"
