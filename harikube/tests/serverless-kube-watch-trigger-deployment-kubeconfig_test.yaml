suite: ServerlessKubeWatchTrigger Deployment Kubeconfig

# Unit test: ensure the serverless-kube-watch-trigger Deployment is working correctly
# Note: KUBECONFIG-specific features are aspirational and not yet implemented in the template.

templates:
  - serverless-kube-watch-trigger-deployment.yaml

tests:
  - it: should render Deployment when serverless-kube-watch-trigger is created
    templates:
      - serverless-kube-watch-trigger-deployment.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
        leaderElection:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serverless-kube-watch-trigger-controller-manager
      - hasDocuments:
          count: 1
