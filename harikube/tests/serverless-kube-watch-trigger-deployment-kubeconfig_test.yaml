suite: ServerlessKubeWatchTrigger Deployment Kubeconfig

# Unit test: ensure the serverless-kube-watch-trigger Deployment mounts a dedicated vCluster kubeconfig Secret
# and prefers KUBECONFIG for auth (TDD-style; production change will update the template to satisfy this test)

templates:
  - serverless-kube-watch-trigger-deployment.yaml

tests:
  - it: should render Deployment mounting a vCluster kubeconfig secret and prefer KUBECONFIG
    templates:
      - serverless-kube-watch-trigger-deployment.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        volumes:
          - name: kubeconfig
            secret:
              secretName: vc-serverless-kube-watch-trigger
              items:
                - key: config
                  path: config
        volumeMounts:
          - name: kubeconfig
            mountPath: /etc/kubernetes/kubeconfig
            readOnly: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig
            secret:
              items:
                - key: config
                  path: config
              secretName: vc-serverless-kube-watch-trigger
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kubeconfig
            mountPath: /etc/kubernetes/kubeconfig
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBECONFIG
            value: /etc/kubernetes/kubeconfig/config
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          count: 1
