suite: Default vCluster Kubeconfig Values

# Unit tests: ensure host-running controllers are created when only the component create flags are enabled (values-driven tests).
# Note: vCluster kubeconfig specific wiring is aspirational and not yet implemented.

templates:
  - api-extension-deployment.yaml
  - serverless-kube-watch-trigger-deployment.yaml

tests:
  - it: api-extension should render Deployment when created
    templates:
      - api-extension-deployment.yaml
    set:
      apiExtension:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: api-extension-controller-manager

  - it: serverless-kube-watch-trigger should render Deployment when created
    templates:
      - serverless-kube-watch-trigger-deployment.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
        image:
          registry: docker.io
        replicaCount: 1
        leaderElection:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: serverless-kube-watch-trigger-controller-manager
