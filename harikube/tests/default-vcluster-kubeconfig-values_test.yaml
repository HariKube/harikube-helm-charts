suite: Default vCluster Kubeconfig Values

# Unit tests: ensure host-running controllers receive their default vCluster kubeconfig Secret wiring
# from chart values when only the component create flags are enabled (values-driven tests).

templates:
  - api-extension-deployment.yaml
  - serverless-kube-watch-trigger-deployment.yaml

tests:
  - it: api-extension should use default vCluster kubeconfig secret from values when created
    templates:
      - api-extension-deployment.yaml
    set:
      apiExtension:
        create: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig
            secret:
              secretName: vc-api-extension-x-harikube-x-harikube
              defaultMode: 420
              items:
                - key: config
                  path: config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kubeconfig
            mountPath: /etc/kubernetes/kubeconfig
            readOnly: true

  - it: serverless-kube-watch-trigger should use default vCluster kubeconfig secret from values when created
    templates:
      - serverless-kube-watch-trigger-deployment.yaml
    set:
      serverlessKubeWatchTrigger:
        create: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig
            secret:
              secretName: vc-serverless-kube-watch-trigger-x-harikube-x-harikube
              defaultMode: 420
              items:
                - key: config
                  path: config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kubeconfig
            mountPath: /etc/kubernetes/kubeconfig
            readOnly: true
