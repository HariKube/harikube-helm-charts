suite: api-extension PVC Required When Enabled

# Unit test: ensure api-extension PVC is always created when apiExtension.create is true
# PVC is mandatory for api-extension deployment to function (cache storage requirement)

templates:
  - api-extension-pvc.yaml

tests:
  - it: should create PVC when apiExtension.create is true (PVC is mandatory)
    set:
      apiExtension:
        create: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: api-extension-decision-maker-cache
      - hasDocuments:
          count: 1

  - it: should not create PVC when apiExtension.create is false
    set:
      apiExtension:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create PVC with correct storage request
    set:
      apiExtension:
        create: true
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: should create PVC with ReadWriteOnce access mode
    set:
      apiExtension:
        create: true
    asserts:
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce

  - it: should create PVC in the release namespace
    set:
      apiExtension:
        create: true
    asserts:
      - matchRegex:
          path: metadata.namespace
          pattern: '^.*$'
